<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mindou Dibala Gloria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="container nav-container">
            <a href="index.html" class="logo">Mindou Dibala Gloria</a>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="competences.html">Compétences</a></li>
                <li><a href="projets.html">Projets</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Me Contacter</h1>
            <p>N'hésitez pas à me laisser un message</p>
        </header>

        <div style="max-width: 600px; margin: 0 auto;" class="card">
            <form action="https://formsubmit.co/mindougloria@gmail.com" method="POST">
                <!-- Redirection facultative après l'envoi (optionnel) -->
                <input type="hidden" name="_captcha" value="false">
                
                <div class="form-group">
                    <label for="nom">Nom / Prénom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="sujet">Sujet</label>
                    <input type="text" id="sujet" name="sujet" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Envoyer</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Portfolio Mindou Dibala Gloria — BTS SIO SLAM</p>
    </footer>

</body>
</html>
